<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boxing Daily Digest</title>
  <meta name="description" content="The latest boxing headlines from public news feeds, updated every morning.">
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --accent: #b3261e;
      --border: #e4e2dc;
      --warn-bg: #fff6e0;
      --warn-text: #7a5600;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --card: #1e1e21;
        --text: #ececee;
        --muted: #a0a0a8;
        --accent: #ff6b5e;
        --border: #2e2e33;
        --warn-bg: #3a2f12;
        --warn-text: #f3d48a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    header h1 { margin: 0; font-size: 1.9rem; letter-spacing: -0.02em; }
    header h1 span { color: var(--accent); }
    .updated { margin: 4px 0 24px; color: var(--muted); font-size: 0.9rem; }
    .notice {
      background: var(--warn-bg); color: var(--warn-text);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.92rem;
    }
    .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .card a { display: block; padding: 16px 18px; color: inherit; text-decoration: none; }
    .card h2 { margin: 0 0 6px; font-size: 1.05rem; font-weight: 600; line-height: 1.35; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .source { color: var(--accent); font-weight: 600; }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
    footer { margin-top: 32px; color: var(--muted); font-size: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🥊 Boxing <span>Daily Digest</span></h1>
      <p class="updated" id="updated">Loading headlines…</p>
    </header>
    <div id="notices"></div>
    <ul class="cards" id="cards"></ul>
    <footer>Headlines and links only — each card opens the original article on the publisher's site.</footer>
  </main>

  <script>
    const fmt = (iso, opts) => {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleString(undefined, opts);
    };

    function notice(text) {
      const div = document.createElement("div");
      div.className = "notice";
      div.textContent = text;
      document.getElementById("notices").appendChild(div);
    }

    function render(data) {
      document.getElementById("updated").textContent =
        data.last_updated ? "Last updated: " + fmt(data.last_updated, { dateStyle: "full", timeStyle: "short" }) : "Not updated yet";

      for (const f of data.feeds || []) {
        if (!f.ok) {
          notice(`We couldn't reach ${f.source} on the last update` +
                 (f.count ? ` — showing its earlier headlines instead.` : `. Its headlines will be back next time.`));
        }
      }

      const list = document.getElementById("cards");
      const items = data.items || [];
      if (!items.length) {
        list.innerHTML = '<li class="empty">No headlines yet — check back after the next update.</li>';
        return;
      }
      for (const item of items) {
        const li = document.createElement("li");
        li.className = "card";
        const a = document.createElement("a");
        a.href = item.link;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        const h2 = document.createElement("h2");
        h2.textContent = item.title;
        const meta = document.createElement("div");
        meta.className = "meta";
        const src = document.createElement("span");
        src.className = "source";
        src.textContent = item.source;
        meta.appendChild(src);
        const when = item.published ? fmt(item.published, { dateStyle: "medium", timeStyle: "short" }) : "";
        if (when) meta.append(" · " + when);
        a.append(h2, meta);
        li.appendChild(a);
        list.appendChild(li);
      }
    }

    fetch("data.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => {
        document.getElementById("updated").textContent = "";
        notice("Sorry — the headlines couldn't be loaded right now. Please try again in a little while.");
      });
  </script>
</body>
</html>
